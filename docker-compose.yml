version: "3.9"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"  # inbound webhook (platform → bot); keep in sync with BOT_WEBHOOK_PORT
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grammerce
      POSTGRES_PASSWORD: grammerce
      POSTGRES_DB: grammerce_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grammerce -d grammerce_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
